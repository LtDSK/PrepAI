
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 15% 20%, #49336f 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, #30234e 0%, transparent 35%),
        #100d18;

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 1050px;
    background: rgba(35, 29, 47, 0.88);
    padding: 14px;
    border-radius: 22px;

    display: flex;
    gap: 35px;

    border: 1px solid rgba(255, 255, 255, 0.09);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        0 0 40px rgba(135, 91, 210, 0.08);

    backdrop-filter: blur(20px);

    animation: containerEntry 0.8s ease both;
}

.left {
    width: 50%;
    min-height: 620px;
    border-radius: 15px;
    padding: 32px;

    background:
        linear-gradient(
            180deg,
            rgba(20, 12, 35, 0.15),
            rgba(15, 8, 28, 0.85)
        ),
        url("https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1000");

    background-size: cover;
    background-position: center;

    color: white;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    position: relative;
    overflow: hidden;
}

.left::after {
    content: "";
    position: absolute;
    inset: 0;

    background: linear-gradient(
        135deg,
        rgba(139, 92, 246, 0.13),
        transparent 60%
    );

    pointer-events: none;
}

.logo {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #c8aaff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    position: relative;
    z-index: 1;
}

.left-text {
    text-align: center;
    font-size: 29px;
    font-weight: 650;
    line-height: 1.5;
    letter-spacing: -0.5px;

    padding-bottom: 45px;

    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.5);

    position: relative;
    z-index: 1;
}

.right {
    width: 50%;
    padding: 48px 35px;
    color: #fff;

    animation: formEntry 0.9s ease both;
}

h1 {
    font-size: 36px;
    font-weight: 750;
    letter-spacing: -1.2px;
    margin-bottom: 14px;
    color: #ffffff;
}

.login {
    color: #aaa1b9;
    font-size: 14px;
    margin-bottom: 40px;
}

a {
    color: #b99aff;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

a:hover {
    color: #d6c1ff;
}

.name {
    display: flex;
    gap: 13px;
}

input {
    width: 100%;
    padding: 16px;

    margin-bottom: 17px;

    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 9px;

    outline: none;

    background: rgba(255, 255, 255, 0.055);

    color: white;
    font-size: 14px;

    transition:
        border-color 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
}

input::placeholder {
    color: #938ba1;
}

input:hover {
    border-color: rgba(177, 139, 255, 0.35);
}

input:focus {
    border-color: #a77bff;

    background: rgba(139, 92, 246, 0.09);

    box-shadow:
        0 0 0 3px rgba(139, 92, 246, 0.13),
        0 0 18px rgba(139, 92, 246, 0.08);
}

.name input {
    width: 50%;
    min-width: 0;
}

.create {
    width: 100%;
    padding: 16px;

    background: linear-gradient(
        110deg,
        #7650d5,
        #9869eb,
        #7953d1
    );

    background-size: 200% 100%;

    border: 1px solid rgba(255, 255, 255, 0.12);
    color: white;

    border-radius: 9px;

    cursor: pointer;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.3px;

    box-shadow:
        0 5px 18px rgba(118, 80, 213, 0.25);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background-position 0.4s ease;
}

.create:hover {
    transform: translateY(-3px);

    background-position: 100% 0;

    box-shadow:
        0 10px 28px rgba(139, 92, 246, 0.35);
}

.create:active {
    transform: translateY(-1px);
}

.or {
    text-align: center;
    margin: 28px 0;

    color: #8f879c;
    font-size: 13px;
    letter-spacing: 0.5px;
}

.social {
    display: flex;
    justify-content: center;
}

.social button {
    width: 100%;
    max-width: 220px;
    height: 52px;

    background: rgba(255, 255, 255, 0.045);

    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 9px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: all 0.3s ease;
}

.social button img {
    width: 22px;
    height: 22px;

    transition: transform 0.3s ease;
}

.social button:hover {
    background: rgba(255, 255, 255, 0.09);

    border-color: rgba(177, 139, 255, 0.6);

    transform: translateY(-3px);

    box-shadow:
        0 8px 22px rgba(139, 92, 246, 0.16);
}

.social button:hover img {
    transform: scale(1.12);
}

.social button:active {
    transform: translateY(-1px);
}

@keyframes containerEntry {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes formEntry {
    from {
        opacity: 0;
        transform: translateX(20px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@media(max-width: 750px) {

    body {
        padding: 15px;
    }

    .container {
        flex-direction: column;
        gap: 10px;
        padding: 10px;
    }

    .left,
    .right {
        width: 100%;
    }

    .left {
        min-height: 260px;
        padding: 25px;
    }

    .left-text {
        font-size: 23px;
        padding-bottom: 15px;
    }

    .right {
        padding: 30px 18px;
    }

    h1 {
        font-size: 29px;
    }

    .login {
        margin-bottom: 30px;
    }
}

@media(max-width: 380px) {

    .name {
        flex-direction: column;
        gap: 0;
    }

    .name input {
        width: 100%;
    }

    h1 {
        font-size: 26px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="left">
        <div>
            <span class="logo">PrepAI</span>
        </div>

        <div class="left-text">
            Prepare Smart With PrepAI...
        </div>
    </div>

    <div class="right">

        <h1>Create an account</h1>

        <p class="login">
            Already have an account?
            <a href="./frontEnd/Login/loginAcc.html">Log in</a>
        </p>

        <form>
            <div class="name">
                <input type="text" placeholder="First name">
                <input type="text" placeholder="Last name">
            </div>

            <input type="email" placeholder="Email">

            <input type="password" placeholder="Enter your password">

            <button class="create" type="submit">
                Create account
            </button>
        </form>

        <p class="or">────── Or register with ──────</p>

        <div class="social">
            <button type="button"><img src="google.png" alt="google" height="20px" width="20px"></button>
        </div>

    </div>

</div>

</body>
</html>
